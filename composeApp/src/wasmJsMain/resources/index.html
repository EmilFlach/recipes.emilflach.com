<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emil & Lucia's Recipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,600&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="/styles.css">
    <script type="application/javascript" src="/composeApp.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check for system dark mode preference
            const prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDarkMode) {
                document.documentElement.classList.add('dark-mode');
            }

            // Listen for changes in dark mode preference
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                if (event.matches) {
                    document.documentElement.classList.add('dark-mode');
                } else {
                    document.documentElement.classList.remove('dark-mode');
                }
            });

            function checkAppReady() {
                const canvas = document.querySelector('canvas');
                return canvas && canvas.offsetHeight > 0;
            }

            let appLoaded = false;
            window.addEventListener('load', function() {
                const readyCheckInterval = setInterval(function() {
                    if (checkAppReady() || appLoaded) {
                        clearInterval(readyCheckInterval);
                        hideSplashScreen();
                    }
                }, 50);

                // Failsafe - hide splash after reasonable timeout
                setTimeout(function() {
                    clearInterval(readyCheckInterval);
                    appLoaded = true;
                    hideSplashScreen();
                }, 15000);
            });

            function hideSplashScreen() {
                const splashScreen = document.getElementById('splash-screen');
                if (splashScreen) {
                    document.body.classList.add('app-ready');
                }
            }
        });
    </script>
</head>
<body>
    <div id="splash-screen">
        <h1>Emil & Lucia's 24 recipes</h1>
        <p>Our recipes are still simmering...</p>
        <div class="splash-spinner"></div>
    </div>
</body>
</html>
